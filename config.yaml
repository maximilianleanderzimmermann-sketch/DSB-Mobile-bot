# Deine Kurse. Nur Zeilen des Vertretungsplans, die hier matchen, lösen eine
# Benachrichtigung aus.
#
# ACHTUNG GROSS-/KLEINSCHREIBUNG: Im Jahrgangsraster gibt es Kurse, die sich NUR
# durch die Schreibweise unterscheiden — z.B. "ma102" (dein Grundkurs) und
# "MA102" (ein Leistungskurs). Deshalb steht ignore_case auf false. Nicht auf
# true stellen, sonst bekommst du fremde Kurse mitgemeldet.
ignore_case: false

# Jahrgang, der in der Klassen-Spalte des Plans stehen muss.
# Kurskuerzel sind NICHT eindeutig: "EN101" gibt es in Jahrgang 13 UND in
# Jahrgang 12. Ohne diese Schranke kaemen fremde Jahrgaenge mit.
# Kombinationen wie "13, 12" zaehlen mit, "12" allein nicht.
klasse: "13"

# Das ganze Infoblatt als Bild verschicken, sobald sich die Prüfsumme ändert.
# Bewusst AUS: Das Blatt wird im Lauf des Tages mehrfach neu erzeugt, das gab
# eine Nachricht nach der anderen. Ersetzt durch info_sheet weiter unten, das
# einzelne Meldungen vergleicht statt des ganzen Bildes.
notify_on_images: false

# Das tägliche Infoblatt per Texterkennung auswerten und nur die Meldungen
# schicken, die dich betreffen.
#
# Das Blatt ist zweispaltig: links der Empfänger ("Alle:", "Jg. 6:", "HAB:"),
# rechts die Meldung. Gemeldet wird ein Block, wenn sein Empfänger unter
# "for_me" steht. Verglichen wird Meldung für Meldung — eine neue Fassung des
# Blatts allein löst also nichts aus.
info_sheet:
  enabled: true

  # Empfänger, die dich meinen. Groß-/Kleinschreibung und Umlaute sind egal:
  # das OCR-Modell kennt keine Umlaute ("Jg." statt "Jg", "Pad." statt "Päd."),
  # deshalb wird vor dem Vergleich beidseitig normalisiert.
  for_me:
    - "Alle"
    - "Jg. 13"
    - "Jahrgang 13"
    - "Q4"

  # Zeilen über die volle Blattbreite haben keinen Empfänger (z.B. "Große Halle
  # 1.-4. Stunde nicht verfügbar"). Auf true setzen, wenn du die auch willst —
  # dann kommt allerdings auch schulweites Beiwerk mit.
  include_general: false

  # Nie melden, egal wo es steht.
  ignore:
    - "Sextaner"
    - "Bereitschaft"
    - "Pausenkonferenz"

# "match" = alle Begriffe müssen in der Zeile vorkommen (UND-Verknüpfung).
# Der Lehrer steht als zweiter Begriff mit drin, wo er die Zuordnung eindeutiger
# macht — falls das zu streng ist, den Lehrer einfach löschen.
courses:
  - label: "Englisch LK"
    match: ["EN101"]

  - label: "Sport LK"
    match: ["SP202"]

  - label: "Deutsch"
    match: ["de103"]

  - label: "Mathe"
    match: ["ma102"]

  - label: "Physik"
    match: ["ph101"]

  - label: "Geschichte"
    match: ["ge206"]

  - label: "PoWi"
    match: ["pw105"]

  - label: "Religion (kath.)"
    match: ["rk107"]

  - label: "Tutorium"
    match: ["Tut1"]

# Einzelbegriffe, die immer melden — für Aushänge ohne Kursbezug.
# Beispiel: eine Zeile, die den ganzen Jahrgang betrifft.
always_notify: []
  # - "Jg. 13 frei"
