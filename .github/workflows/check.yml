name: Vertretungsplan prüfen

on:
  schedule:
    # UTC. 04–17 Uhr UTC entspricht ca. 06–19 Uhr deutscher Zeit, Mo–Fr.
    # GitHub-Cron ist nicht pünktlich: 5–20 Min Verspätung sind normal.
    - cron: "*/15 4-17 * * 1-5"
  workflow_dispatch:

concurrency:
  group: dsb-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Auf Änderungen prüfen
        env:
          DSB_USER: ${{ secrets.DSB_USER }}
          DSB_PASSWORD: ${{ secrets.DSB_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m dsbwatch check

      # Runner haben kein bleibendes Dateisystem — der State muss zurück ins Repo.
      # Der Commit hält das Repo nebenbei aktiv, sonst schaltet GitHub den Cron
      # nach 60 Tagen ohne Aktivität ab.
      - name: State zurückschreiben
        if: always()
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain state/state.json)" ]]; then
            git config user.name "dsb-watcher[bot]"
            git config user.email "dsb-watcher@users.noreply.github.com"
            git add state/state.json
            git commit -m "chore: State aktualisiert [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "State unverändert."
          fi
