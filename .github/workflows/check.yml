name: Vertretungsplan prüfen

on:
  # workflow_dispatch ist der EIGENTLICHE Ausloeser: ein externer Cron-Dienst
  # ruft alle 15 Minuten die GitHub-API auf. Grund: GitHubs eigener schedule ist
  # unzuverlaessig. Gemessen ueber drei Wochen kamen statt 56 Laeufen pro Tag nur
  # 18-26 an, und vom 27.8. bis 31.8. fiel er komplett aus — deshalb blieb der
  # Englisch-Entfall am 31.8. unbemerkt. Laeufe werden unter Last nicht nur
  # verzoegert, sondern ersatzlos verworfen.
  workflow_dispatch:

  # Nur noch als Notnagel, falls der externe Ausloeser ausfaellt.
  schedule:
    - cron: "*/30 3-19 * * 1-5"

concurrency:
  group: dsb-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # opencv (kommt mit der Texterkennung) braucht libGL. Auf schlanken
      # Runner-Images fehlt das und der Import stirbt mit "libGL.so.1 not found".
      # Der Paketname wechselte mit Ubuntu 24.04 — beide Schreibweisen versuchen.
      - name: Systembibliotheken für OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0 \
            || sudo apt-get install -y -qq libgl1-mesa-glx libglib2.0-0

      - run: pip install -r requirements.txt

      - name: Auf Änderungen prüfen
        env:
          DSB_USER: ${{ secrets.DSB_USER }}
          DSB_PASSWORD: ${{ secrets.DSB_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m dsbwatch check

      # Runner haben kein bleibendes Dateisystem — der State muss zurück ins Repo.
      # Der Commit hält das Repo nebenbei aktiv, sonst schaltet GitHub den Cron
      # nach 60 Tagen ohne Aktivität ab.
      - name: State zurückschreiben
        if: always()
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain state/state.json)" ]]; then
            git config user.name "dsb-watcher[bot]"
            git config user.email "dsb-watcher@users.noreply.github.com"
            git add state/state.json
            git commit -m "chore: State aktualisiert [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "State unverändert."
          fi
